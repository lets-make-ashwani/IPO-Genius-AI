version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ipo_genius_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ipo_genius
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: ipo_genius_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/ipo_genius
      - JWT_SECRET=super_secret_jwt_signing_key_change_me_in_production
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      - db

volumes:
  postgres_data:
